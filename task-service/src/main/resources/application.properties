server.port=8082
spring.application.name=task-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/taskdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Diğer servislerle AYNI secret olmalı
jwt.secret=${JWT_SECRET:cok-gizli-bir-anahtar-en-az-32-karakter-olmali-12345}

# Category Service (senkron REST çağrısı)
category.service.url=${CATEGORY_SERVICE_URL:http://localhost:8084}

# RabbitMQ (asenkron olaylar). Bağlantı zaman aşımı kısa tutulur: broker kapalıysa istek asılı kalmasın.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:taskapp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:taskapp123}
spring.rabbitmq.connection-timeout=2000

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}
# ÖNEMLİ: RabbitMQ kapalıyken /actuator/health "DOWN" olmasın; yoksa Kubernetes pod'u trafikten çıkarır
# ve görev API'si broker yüzünden durur. Broker bu servis için kritik olmayan bir bağımlılıktır.
management.health.rabbit.enabled=false
