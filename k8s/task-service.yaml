apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      enableServiceLinks: false     # K8s'in otomatik ürettiği *_PORT değişkenleri bizimkilerle çakışmasın
      containers:
        - name: task-service
          image: bnjmn034/task-service:latest
          imagePullPolicy: Always   # :latest etiketi önbellekten eski imaj çalıştırmasın
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: OTEL_SERVICE_NAME
              value: task-service
            - name: DB_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: TASKS_DB_URL }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_USERNAME }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD }
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "640Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  selector:
    app: task-service
  ports:
    - port: 8082
      targetPort: 8082
