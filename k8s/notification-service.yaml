apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      enableServiceLinks: false     # K8s'in otomatik ürettiği *_PORT değişkenleri bizimkilerle çakışmasın
      containers:
        - name: notification-service
          image: bnjmn034/notification-service:latest
          imagePullPolicy: Always   # :latest etiketi önbellekten eski imaj çalıştırmasın
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: OTEL_SERVICE_NAME
              value: notification-service
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_USERNAME }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD }
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "640Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 8083
      targetPort: 8083
