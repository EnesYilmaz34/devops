apiVersion: apps/v1
kind: Deployment
metadata:
  name: category-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: category-service
  template:
    metadata:
      labels:
        app: category-service
    spec:
      enableServiceLinks: false     # K8s'in otomatik ürettiği *_PORT değişkenleri bizimkilerle çakışmasın
      containers:
        - name: category-service
          image: bnjmn034/category-service:latest
          imagePullPolicy: Always   # :latest etiketi önbellekten eski imaj çalıştırmasın
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: OTEL_SERVICE_NAME
              value: category-service
            - name: DB_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: CATEGORIES_DB_URL }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "640Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: category-service
spec:
  selector:
    app: category-service
  ports:
    - port: 8084
      targetPort: 8084
